<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Name Sculpture Designer</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <h1>Name Sculpture Designer</h1>

        <section>
          <label for="mode">Design mode</label>
          <select id="mode">
            <option value="m2" selected>Arabic + English name</option>
            <option value="m1">Big letter + Arabic name</option>
            <option value="m3">Arabic only</option>
          </select>
        </section>

        <section>
          <label for="arabicText">Arabic name</label>
          <input id="arabicText" dir="rtl" lang="ar" value="أحمد" autocomplete="off" />
          <label for="arabicFont">Arabic font</label>
          <select id="arabicFont"></select>
        </section>

        <section data-modes="m2">
          <label for="englishText">English name</label>
          <input id="englishText" value="Ahmed" autocomplete="off" />
          <label for="englishFont">English font</label>
          <select id="englishFont"></select>
          <label for="placement">English placement</label>
          <select id="placement">
            <option value="front" selected>Standing in front (base)</option>
            <option value="overlay">Overlay on Arabic face</option>
            <option value="inline">Merged — single color</option>
          </select>
        </section>

        <section data-modes="m1">
          <label for="letter">Big letter</label>
          <input id="letter" maxlength="2" value="A" autocomplete="off" />
          <label for="letterFont">Letter font</label>
          <select id="letterFont"></select>
        </section>

        <section>
          <div class="row">
            <label for="size">Size <output id="sizeOut">180</output> mm</label>
            <input type="range" id="size" min="80" max="235" step="1" value="180" />
          </div>
          <div class="row">
            <label for="baseDepth">Base depth <output id="baseDepthOut">16</output> mm</label>
            <input type="range" id="baseDepth" min="8" max="40" step="1" value="16" />
          </div>
          <div class="row" data-modes="m2">
            <label for="accentDepth">English depth <output id="accentDepthOut">12</output> mm</label>
            <input type="range" id="accentDepth" min="6" max="30" step="1" value="12" />
          </div>
          <div class="row" data-modes="m2">
            <label for="englishScale">English size <output id="englishScaleOut">0.55</output>×</label>
            <input type="range" id="englishScale" min="0.25" max="1.1" step="0.05" value="0.55" />
          </div>
          <div class="row" data-modes="m1 m2">
            <label for="nudgeX">Nudge X <output id="nudgeXOut">0</output> mm</label>
            <input type="range" id="nudgeX" min="-80" max="80" step="1" value="0" />
          </div>
          <div class="row" data-modes="m1 m2">
            <label for="nudgeY">Nudge Y <output id="nudgeYOut">0</output> mm</label>
            <input type="range" id="nudgeY" min="-80" max="80" step="1" value="0" />
          </div>
        </section>

        <section data-modes="m2 m3">
          <label class="check"><input type="checkbox" id="plinth" /> Add plinth base</label>
          <div class="row">
            <label for="plinthHeight">Plinth height <output id="plinthHeightOut">12</output> mm</label>
            <input type="range" id="plinthHeight" min="6" max="30" step="1" value="12" />
          </div>
        </section>

        <details>
          <summary>Advanced</summary>
          <div class="row">
            <label for="overlayThickness">Overlay thickness <output id="overlayThicknessOut">4</output> mm</label>
            <input type="range" id="overlayThickness" min="2" max="8" step="0.5" value="4" />
          </div>
          <div class="row">
            <label for="pocketDepth">Pocket depth <output id="pocketDepthOut">0.8</output> mm</label>
            <input type="range" id="pocketDepth" min="0" max="2" step="0.2" value="0.8" />
          </div>
          <div class="row">
            <label for="keel">Flatten bottom <output id="keelOut">2.5</output> mm</label>
            <input type="range" id="keel" min="1" max="8" step="0.5" value="2.5" />
          </div>
        </details>

        <section class="colors">
          <div>
            <label for="baseColor">Base color</label>
            <input type="color" id="baseColor" value="#6f8fae" />
          </div>
          <div>
            <label for="accentColor">Accent color</label>
            <input type="color" id="accentColor" value="#f5f2ec" />
          </div>
        </section>

        <section class="exports">
          <button id="exportStl" disabled>Export STLs (zip)</button>
          <button id="export3mf" disabled>Export 3MF</button>
        </section>

        <div id="warnings"></div>
        <div id="stats"></div>
      </aside>
      <main id="viewport">
        <div id="status">Loading engines…</div>
      </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
